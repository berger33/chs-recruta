name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: node --check static/app.js
      - run: node --check static/advanced.js
      - run: node --check static/portal.js
      - run: node --check static/workforce.js
      - run: DATABASE_URL=sqlite:////tmp/chs-migration.db alembic upgrade head
      - run: python -m pytest -q
